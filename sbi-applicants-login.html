<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBI Applicants - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1C3F75;
            /* Dark blue from button */
            --accent-orange: #FF7055;
            /* Orange from forgot password */
            --bg-color: #E6EBF5;
            /* Light blue-grey background */
            --input-bg: #F8F9FA;
            --text-main: #1A1A1A;
            --text-secondary: #6B7280;
            --border-color: #E0E0E0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 1400px;
            /* Wide container */
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* Left Side - Illustration & Decoration */
        .left-panel {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px;
        }

        .illustration {
            max-width: 100%;
            height: auto;
            max-height: 500px;
            z-index: 2;
        }

        /* Decorative Elements */
        .decoration {
            position: absolute;
            z-index: 1;
        }

        .squiggle-top-left {
            top: -50px;
            left: 0;
            width: 150px;
            stroke: #3B5998;
            stroke-width: 2;
            fill: none;
        }

        .squiggle-bottom-right {
            bottom: -50px;
            right: 50px;
            width: 180px;
            stroke: #3B5998;
            stroke-width: 2;
            fill: none;
        }

        .circle-outline {
            width: 40px;
            height: 40px;
            border: 2px solid #3B5998;
            border-radius: 50%;
            position: absolute;
            top: 10%;
            right: 20%;
        }

        .circle-red {
            width: 20px;
            height: 20px;
            border: 2px solid #FF5252;
            border-radius: 50%;
            position: absolute;
        }

        .diamond-pattern {
            position: absolute;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .diamond {
            width: 10px;
            height: 10px;
            background-color: #D32F2F;
            transform: rotate(45deg);
        }

        /* Right Side - Login Form */
        .right-panel {
            flex: 0 0 500px;
            /* Fixed width for form */
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 50px;
            border-radius: 8px;
            /* Slightly rounded corners as per image */
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            /* Soft shadow */
        }

        .logo-img {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
            display: block;
        }

        .welcome-text {
            font-size: 32px;
            color: var(--primary-blue);
            font-weight: 500;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            background-color: #fff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(28, 63, 117, 0.1);
        }

        .form-input::placeholder {
            color: #A0A0A0;
        }

        /* Security Text Row */
        .security-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .captcha-display-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 120px;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1h2v2H1V1zm4 4h2v2H5V5zm4 4h2v2H9V9z' fill='%23f0f0f0' fill-opacity='1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .captcha-code {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 2px;
            color: #000;
            text-decoration: line-through;
            transform: skew(-10deg);
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary-blue);
            margin-left: 10px;
            display: flex;
            align-items: center;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-blue);
            border-radius: 4px;
        }

        .checkbox-group label {
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            background-color: #153260;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--accent-orange);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Error Message */
        .error-message {
            background: #ffebee;
            color: #d32f2f;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                justify-content: center;
            }

            .left-panel {
                display: none;
                /* Hide illustration on mobile for cleaner look or stack it */
            }

            .right-panel {
                flex: 1;
                width: 100%;
                max-width: 450px;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- Left Panel with Illustration and Decor -->
        <div class="left-panel">
            <!-- Top Left Squiggle -->
            <svg class="decoration squiggle-top-left" viewBox="0 0 100 50">
                <path d="M0,25 C20,50 40,0 60,25 C80,50 100,0 120,25" />
            </svg>

            <!-- Bottom Right Squiggle -->
            <svg class="decoration squiggle-bottom-right" viewBox="0 0 100 50">
                <path d="M0,25 C20,50 40,0 60,25 C80,50 100,0 120,25" />
            </svg>

            <!-- Red Circle -->
            <div class="decoration circle-red" style="top: 20%; left: 15%;"></div>
            <div class="decoration circle-outline"></div>

            <!-- Diamond Patterns (Red) -->
            <div class="decoration diamond-pattern" style="top: 15%; right: 40%;">
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
            </div>
            <div class="decoration diamond-pattern" style="bottom: 20%; left: 10%;">
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
            </div>


            <img src="images/login-illustration.png" alt="Applicant Working" class="illustration">
        </div>

        <!-- Right Panel - Login Form -->
        <div class="right-panel">
            <div class="login-card">
                <img src="images/yono-logo.png" alt="Yono SBI" class="logo-img">
                <h1 class="welcome-text">Welcome Back</h1>

                <!-- Error Display -->
                <div class="error-message" id="errorMessage">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="errorText">Invalid credentials.</span>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">User Name</label>
                        <input type="text" class="form-input" id="userId" placeholder="hannah.green@test.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="password" placeholder="Password123@" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Security Text</label>
                        <div class="security-row">
                            <input type="text" class="form-input" id="captchaInput" placeholder="Enter the shown text"
                                style="flex: 1;" required>
                            <div class="captcha-display-container">
                                <span class="captcha-code" id="captchaDisplay">MKFXC</span>
                                <button type="button" class="refresh-btn" id="refreshCaptcha" title="Refresh Code">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M23 4v6h-6"></path>
                                        <path d="M1 20v-6h6"></path>
                                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15">
                                        </path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" checked>
                        <label for="rememberMe">Remember me on this computer</label>
                    </div>

                    <button type="submit" class="login-btn">LOG IN</button>

                    <a href="#" class="forgot-password">Forgot Password?</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://rdubzgyjyyumapvifwuq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdWJ6Z3lqeXl1bWFwdmlmd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyOTI0OTAsImV4cCI6MjA4MDg2ODQ5MH0.ZNgFLKO0z5xpASKFAr1uXp8PPmNsdpwN58I7dP6ZIeM';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // CAPTCHA Logic
        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let captcha = '';
            for (let i = 0; i < 5; i++) { // 5 chars to match design approx
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return captcha;
        }

        function displayCaptcha() {
            currentCaptcha = generateCaptcha();
            document.getElementById('captchaDisplay').textContent = currentCaptcha;
            document.getElementById('captchaInput').value = '';
        }

        document.getElementById('refreshCaptcha').addEventListener('click', displayCaptcha);

        // Initialize
        displayCaptcha();

        // Login Logic
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loginBtn = loginForm.querySelector('.login-btn');

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value;
            const captchaInput = document.getElementById('captchaInput').value.toUpperCase();

            // 1. Validate Captcha
            if (captchaInput !== currentCaptcha) {
                errorText.textContent = 'Incorrect Security Text. Please try again.';
                errorMessage.classList.add('show');
                displayCaptcha();
                return;
            }

            // 2. Clear previous errors
            errorMessage.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.textContent = 'LOGGING IN...';

            try {
                // 3. Authenticate with Supabase
                const { data, error } = await sbClient
                    .from('sbi_applicants')
                    .select('*')
                    .eq('email', userId)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    throw new Error('Invalid credentials');
                }

                // 4. Success
                sessionStorage.setItem('applicantId', data.id);
                sessionStorage.setItem('applicantName', data.applicant_name);
                sessionStorage.setItem('applicantEmail', data.email);

                window.location.href = `applicant-details.html?id=${data.id}`;

            } catch (error) {
                console.error('Login failed:', error);
                errorText.textContent = 'Invalid Username or Password.';
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'LOG IN';
            }
        });

        // Clear error on input
        ['userId', 'password', 'captchaInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                errorMessage.classList.remove('show');
            });
        });
    </script>
</body>

</html>
