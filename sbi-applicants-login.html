<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBI Applicants - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sbi-blue: #0066cc;
            --sbi-dark-blue: #004a99;
            --sbi-light-blue: #e6f2ff;
            --sbi-orange: #ff6b35;
            --text-dark: #1a1a1a;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --success-green: #00c853;
            --error-red: #d32f2f;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative background elements */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .logo-circle svg {
            width: 45px;
            height: 45px;
            color: var(--sbi-blue);
        }

        .logo-text {
            color: white;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 0.25rem;
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
        }

        /* Login Card */
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-light);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-light);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
        }

        .form-input:focus {
            border-color: var(--sbi-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .form-input::placeholder {
            color: #999;
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-light);
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--sbi-blue);
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--sbi-blue);
        }

        .remember-me label {
            color: var(--text-dark);
            cursor: pointer;
            font-weight: 500;
        }

        .forgot-password {
            color: var(--sbi-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: var(--sbi-dark-blue);
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--sbi-blue) 0%, var(--sbi-dark-blue) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--text-light);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 1rem;
        }

        /* Biometric Login */
        .biometric-login {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .biometric-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .biometric-btn:hover {
            border-color: var(--sbi-blue);
            background: var(--sbi-light-blue);
            transform: scale(1.05);
        }

        .biometric-btn svg {
            width: 28px;
            height: 28px;
            color: var(--sbi-blue);
        }

        /* Register Link */
        .register-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-light);
        }

        .register-link a {
            color: var(--sbi-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: var(--sbi-dark-blue);
        }

        /* Security Badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: var(--sbi-light-blue);
            border-radius: 10px;
            font-size: 12px;
            color: var(--sbi-dark-blue);
            font-weight: 600;
        }

        .security-badge svg {
            width: 16px;
            height: 16px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Error Message */
        .error-message {
            background: #ffebee;
            color: var(--error-red);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message.show {
            display: flex;
        }

        .error-message svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* CAPTCHA Styles */
        .captcha-container {
            margin-bottom: 1.5rem;
        }

        .captcha-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .captcha-box {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .captcha-display {
            flex: 1;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 8px;
            color: var(--text-dark);
            font-family: 'Courier New', monospace;
            user-select: none;
            text-decoration: line-through;
            text-decoration-style: wavy;
            text-decoration-color: rgba(0, 102, 204, 0.3);
            position: relative;
            overflow: hidden;
        }

        .captcha-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 10px,
                    rgba(0, 102, 204, 0.03) 10px,
                    rgba(0, 102, 204, 0.03) 20px);
            pointer-events: none;
        }

        .captcha-refresh {
            width: 48px;
            height: 48px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .captcha-refresh:hover {
            background: var(--sbi-light-blue);
            border-color: var(--sbi-blue);
        }

        .captcha-refresh svg {
            width: 20px;
            height: 20px;
            color: var(--sbi-blue);
            transition: transform 0.3s ease;
        }

        .captcha-refresh:hover svg {
            transform: rotate(180deg);
        }

        .captcha-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            letter-spacing: 4px;
            text-align: center;
            font-weight: 600;
        }

        .captcha-input:focus {
            border-color: var(--sbi-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .captcha-input::placeholder {
            letter-spacing: normal;
            text-align: left;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.75rem 1.25rem;
            }

            .logo-text {
                font-size: 24px;
            }

            .login-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <div class="logo-text">SBI Applicants</div>
            <div class="logo-subtitle">Secure Banking Portal</div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Login to access your applicant dashboard</p>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="errorText">Invalid credentials. Please try again.</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" class="form-input" id="userId" placeholder="Enter your User ID" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" class="form-input" id="password" placeholder="Enter your password"
                            required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="display: none;">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- CAPTCHA Validation -->
                <div class="captcha-container">
                    <label class="captcha-label">Security Verification</label>
                    <div class="captcha-box">
                        <div class="captcha-display" id="captchaDisplay">AB12CD</div>
                        <button type="button" class="captcha-refresh" id="refreshCaptcha" title="Refresh CAPTCHA">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                        </button>
                    </div>
                    <input type="text" class="captcha-input" id="captchaInput" placeholder="Enter the code above"
                        maxlength="6" required autocomplete="off">
                </div>

                <div class="form-options" style="justify-content: flex-start;">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="login-btn">Login to Dashboard</button>
            </form>

            <!-- Security Badge -->
            <div class="security-badge">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"></path>
                </svg>
                <span>256-bit SSL Encrypted Connection</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://rdubzgyjyyumapvifwuq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdWJ6Z3lqeXl1bWFwdmlmd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyOTI0OTAsImV4cCI6MjA4MDg2ODQ5MH0.ZNgFLKO0z5xpASKFAr1uXp8PPmNsdpwN58I7dP6ZIeM';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeOpen = togglePassword.querySelector('.eye-open');
        const eyeOff = togglePassword.querySelector('.eye-off');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle eye icons
            if (type === 'text') {
                eyeOpen.style.display = 'none';
                eyeOff.style.display = 'block';
            } else {
                eyeOpen.style.display = 'block';
                eyeOff.style.display = 'none';
            }
        });

        // CAPTCHA Logic
        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Exclude similar looking characters
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return captcha;
        }

        function displayCaptcha() {
            currentCaptcha = generateCaptcha();
            document.getElementById('captchaDisplay').textContent = currentCaptcha;
            document.getElementById('captchaInput').value = '';
        }

        // Initialize CAPTCHA on page load
        displayCaptcha();

        // Refresh CAPTCHA button
        document.getElementById('refreshCaptcha').addEventListener('click', function () {
            displayCaptcha();
        });

        // Validate CAPTCHA
        function validateCaptcha() {
            const userInput = document.getElementById('captchaInput').value.toUpperCase();
            return userInput === currentCaptcha;
        }

        // Real-time CAPTCHA validation
        document.getElementById('captchaInput').addEventListener('input', function () {
            const input = this;
            const value = input.value.toUpperCase();

            if (value.length === 6) {
                if (value === currentCaptcha) {
                    input.style.borderColor = '#00c853'; // Success Green
                    input.style.boxShadow = '0 0 0 4px rgba(0, 200, 83, 0.1)';
                } else {
                    input.style.borderColor = '#d32f2f'; // Error Red
                    input.style.boxShadow = '0 0 0 4px rgba(211, 47, 47, 0.1)';
                }
            } else {
                input.style.borderColor = ''; // Reset
                input.style.boxShadow = '';
            }
        });

        // Form Submission with Supabase Authentication
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loginBtn = loginForm.querySelector('.login-btn');

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value;

            // Validate CAPTCHA first
            if (!validateCaptcha()) {
                errorText.textContent = 'Invalid security code. Please try again.';
                errorMessage.classList.add('show');
                displayCaptcha(); // Refresh CAPTCHA
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
                return;
            }

            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                // Query Supabase to find matching applicant
                const { data, error } = await sbClient
                    .from('sbi_applicants')
                    .select('*')
                    .eq('email', userId)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    // Invalid credentials
                    errorText.textContent = 'Invalid email or password. Please try again.';
                    errorMessage.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login to Dashboard';

                    setTimeout(() => {
                        errorMessage.classList.remove('show');
                    }, 3000);
                    return;
                }

                // Successful login - store applicant ID and redirect to their details page
                sessionStorage.setItem('applicantId', data.id);
                sessionStorage.setItem('applicantName', data.applicant_name);
                sessionStorage.setItem('applicantEmail', data.email);

                // Redirect to applicant details page with their ID
                window.location.href = `applicant-details.html?id=${data.id}`;

            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = 'An error occurred. Please try again.';
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to Dashboard';

                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        // Hide error message on input
        document.getElementById('userId').addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });

        document.getElementById('password').addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });
    </script>
</body>

</html>
