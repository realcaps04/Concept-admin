<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Detail - TL Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #2563EB;
            --bg-light: #FDFDFD;
            --text-dark: #111827;
            --text-gray: #6B7280;
            --border-color: #F3F4F6;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        /* Header */
        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(243, 244, 246, 0.6);
        }

        .back-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: #F3F4F6;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .more-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Profile Section */
        .profile-hero {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .avatar-container {
            position: relative;
            margin-bottom: 20px;
        }

        .large-avatar {
            width: 120px;
            height: 120px;
            border-radius: 30px;
            background: linear-gradient(135deg, #FFD29D 0%, #FF9E5E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            color: white;
            box-shadow: 0 10px 25px rgba(255, 158, 94, 0.3);
        }

        .status-badge-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #10B981;
            border: 4px solid white;
        }

        .member-name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .member-id {
            font-size: 15px;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* Stats Card */
        .stats-card {
            margin: 0 20px 24px;
            background: #EFF6FF;
            border-radius: 32px;
            padding: 32px;
            text-align: center;
        }

        .stats-num {
            font-size: 56px;
            font-weight: 800;
            color: var(--primary-blue);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stats-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* Action Buttons */
        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px 32px;
        }

        .btn {
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-secondary {
            background: white;
            color: #10B981;
            border: 1.5px solid #F1F5F9;
            box-shadow: var(--card-shadow);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Breakdown Section */
        .section-header {
            padding: 0 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .link-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-blue);
            text-decoration: none;
        }

        .report-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .report-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            animation: slideUp 0.5s ease-out backwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-blue {
            background: #EFF6FF;
            color: var(--primary-blue);
        }

        .badge-gray {
            background: #F3F4F6;
            color: var(--text-gray);
        }

        .card-icons {
            display: flex;
            gap: 12px;
            color: #94A3B8;
        }

        .report-title {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 16px;
            border-top: 1px solid #F8FAFC;
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: #94A3B8;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        .info-value {
            font-size: 17px;
            font-weight: 800;
        }

        .date-value {
            font-size: 13px;
            font-weight: 600;
            color: #64748B;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #94A3B8;
        }

        .nav-item.active {
            color: var(--primary-blue);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
        }

        /* Skeleton */
        .shimmer {
            background: #f6f7f8;
            background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            animation: placeholderShimmer 1s linear infinite forwards;
        }

        @keyframes placeholderShimmer {
            0% {
                background-position: -468px 0;
            }

            100% {
                background-position: 468px 0;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <h1>Activity Detail</h1>
        <div class="more-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="19" cy="12" r="1"></circle>
                <circle cx="5" cy="12" r="1"></circle>
            </svg>
        </div>
    </header>

    <div class="profile-hero" id="profileHero">
        <div class="avatar-container">
            <div class="large-avatar" id="avatarBox">...</div>
            <div class="status-badge-dot" id="statusDot"></div>
        </div>
        <h2 class="member-name" id="memberName">Loading...</h2>
        <p class="member-id" id="memberId">Employee ID: ---</p>
    </div>

    <div class="stats-card">
        <div class="stats-num" id="totalReports">0</div>
        <div class="stats-label">Total Reports</div>
    </div>

    <div class="action-btns">
        <button class="btn btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download All
        </button>
        <button class="btn btn-secondary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            Export Excel
        </button>
    </div>

    <div class="section-header">
        <div class="section-title">Report Breakdown</div>
        <a href="#" class="link-text">Consolidated View</a>
    </div>

    <div class="report-list" id="reportList">
        <!-- Skeleton -->
        <div style="height: 180px; border-radius: 24px;" class="shimmer"></div>
        <div style="height: 180px; border-radius: 24px;" class="shimmer"></div>
    </div>

    <nav class="bottom-nav">
        <a href="Tldashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Dashboard</span>
        </a>
        <a href="TeamMembers.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Team</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span>Insights</span>
        </a>
        <a href="ProfileSettings.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rdubzgyjyyumapvifwuq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdWJ6Z3lqeXl1bWFwdmlmd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyOTI0OTAsImV4cCI6MjA4MDg2ODQ5MH0.ZNgFLKO0z5xpASKFAr1uXp8PPmNsdpwN58I7dP6ZIeM';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        (async function () {
            // Auth Check
            const tl = JSON.parse(localStorage.getItem('tl_user'));
            if (!tl) { window.location.href = 'FOSTeamLeadLogin.html'; return; }

            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');
            if (!memberId) { window.location.href = 'TeamMembers.html'; return; }

            try {
                // Fetch Member Details
                const { data: member, error: mErr } = await supabase
                    .from('fos_members')
                    .select('*')
                    .eq('employee_id', memberId)
                    .eq('team_leader_id', tl.employee_id)
                    .single();

                if (mErr) {
                    console.error('Member Fetch Error:', mErr);
                    document.getElementById('profileHero').innerHTML = `<p style="padding:20px; color:var(--text-gray);">Member not found or unauthorized access.</p>`;
                    return;
                }

                // UI Update - Hero
                document.getElementById('memberName').textContent = member.name;
                document.getElementById('memberId').textContent = `Employee ID: ${member.employee_id}`;
                const initials = (member.name || 'User').split(' ').map(n => n[0]).filter(Boolean).join('').toUpperCase().substring(0, 2);
                document.getElementById('avatarBox').textContent = initials;
                document.getElementById('statusDot').style.background = member.status === 'active' ? '#10B981' : '#9CA3AF';

                // Fetch All Reports for Statistics
                const [{ data: reports }, { data: recovery }] = await Promise.all([
                    supabase.from('reports').select('*').eq('member_employee_id', memberId),
                    supabase.from('recovery_reports').select('*').eq('member_employee_id', memberId)
                ]);

                const allRecords = [...(reports || []), ...(recovery || [])];
                document.getElementById('totalReports').textContent = allRecords.length;

                // Process Breakdown (Grouping by report_type)
                const groups = {};

                // Regular reports
                (reports || []).forEach(r => {
                    const type = r.report_type || 'General';
                    if (!groups[type]) groups[type] = { count: 0, total: 0, lastDate: null, type: type };
                    groups[type].count++;
                    groups[type].total += r.loan_amount || 0;
                    if (!groups[type].lastDate || new Date(r.created_at) > new Date(groups[type].lastDate)) {
                        groups[type].lastDate = r.created_at;
                    }
                });

                // Recovery reports
                if (recovery && recovery.length > 0) {
                    const recType = 'RECOVERY';
                    groups[recType] = { count: 0, total: 0, lastDate: null, type: recType };
                    recovery.forEach(r => {
                        groups[recType].count++;
                        groups[recType].total += r.amount_received || 0;
                        if (!groups[recType].lastDate || new Date(r.created_at) > new Date(groups[recType].lastDate)) {
                            groups[recType].lastDate = r.created_at;
                        }
                    });
                }

                renderBreakdown(groups);

            } catch (err) {
                console.error('General Error:', err);
                alert('Error loading member data. See console for details.');
            }
        })();

        function renderBreakdown(groups) {
            const list = document.getElementById('reportList');
            list.innerHTML = '';

            const keys = Object.keys(groups).sort((a, b) => groups[b].count - groups[a].count);
            if (keys.length === 0) {
                list.innerHTML = '<p style="text-align:center; padding: 40px; color: var(--text-gray);">No reports submitted yet.</p>';
                return;
            }

            keys.forEach((key, index) => {
                const g = groups[key];
                const card = document.createElement('div');
                card.className = 'report-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="card-top">
                        <div class="badges">
                            <span class="badge badge-blue">${getShortType(g.type)}</span>
                            <span class="badge badge-gray">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-right:4px;">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                                ${g.count} Files
                            </span>
                        </div>
                        <div class="card-icons">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="9" y1="21" x2="9" y2="9"></line>
                            </svg>
                        </div>
                    </div>
                    <div class="report-title">${getDisplayTitle(g.type)}</div>
                    <div class="card-bottom">
                        <div class="info-group">
                            <span class="info-label">Total Value</span>
                            <span class="info-value">₹${g.total.toLocaleString('en-IN')}</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Last Updated</span>
                            <span class="date-value">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                ${formatPrettyDate(g.lastDate)}
                            </span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function getShortType(type) {
            const t = type.toUpperCase();
            if (t.includes('KISAN') || t.includes('KCC')) return 'KCC';
            if (t.includes('RECOVERY')) return 'RECOVERY';
            if (t.includes('PMMY') || t.includes('MUDRA')) return 'PMMY';
            if (t.includes('SME')) return 'SME';
            if (t.includes('SHG')) return 'SHG';
            return 'GENERAL';
        }

        function getDisplayTitle(type) {
            const t = type.toUpperCase();
            if (t.includes('KISAN CREDIT CARD NEW')) return 'Agricultural Loan Report';
            if (t.includes('KISAN CREDIT CARD RENEWAL')) return 'KCC Renewal Portfolio';
            if (t.includes('KCC RENEWAL SANCTION')) return 'Renewed Sanctions';
            if (t.includes('RECOVERY')) return 'Collection Log - Consolidated';
            if (t.includes('PMMY')) return 'Pradhan Mantri Mudra Yojana';
            if (t.includes('SME')) return 'Small Business Lending';
            if (t.includes('SHG')) return 'Self Help Group Report';
            if (t.includes('PMEGP')) return 'Prime Minister Employment Gen';
            if (t.includes('RACC')) return 'RACC Processing Log';
            return `${type} Report`;
        }

        function formatPrettyDate(dateStr) {
            if (!dateStr) return '---';
            const d = new Date(dateStr);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${d.getDate()} ${months[d.getMonth()]}, ${d.getFullYear()}`;
        }
    </script>
</body>

</html>
