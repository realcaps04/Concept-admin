<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice History | Console Projects</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- QRCode Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #3B82F6;
            --background: #F8FAFC;
            --surface: #FFFFFF;
            --text: #1E293B;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            padding: 1.5rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .btn {
            background: var(--primary);
            border: 1px solid var(--primary);
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            text-decoration: none;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        .btn:hover {
            background: #2563EB;
            border-color: #2563EB;
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transform: translateY(-1px);
        }

        .table-container {
            background: var(--surface);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #F1F5F9;
            padding: 1rem 1.25rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #64748B;
            white-space: nowrap;
        }

        td {
            padding: 1.25rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-blue {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #64748B;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 1rem;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: #64748B;
            padding: 0.5rem;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #EF4444;
        }

        .modal-body {
            padding: 2rem;
        }

        .detail-group {
            margin-bottom: 1rem;
        }

        .detail-label {
            font-size: 0.75rem;
            color: #64748B;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            word-break: break-word;
        }

        .items-table {
            width: 100%;
            margin-top: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .items-table th,
        .items-table td {
            font-size: 0.85rem;
            padding: 0.75rem;
        }

        .items-table th {
            background: #F8FAFC;
        }

        .btn-view {
            background: #EFF6FF;
            color: var(--primary);
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view:hover {
            background: #DBEAFE;
        }

        .btn-edit,
        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-edit:hover,
        .btn-save:hover {
            background: #2563EB;
            transform: translateY(-1px);
        }

        .editable-input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .editable-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .editable-textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.85rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }

        .editable-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-add-item-modal {
            background: #DCFCE7;
            color: #166534;
            border: 1px dashed #BBF7D0;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-add-item-modal:hover {
            background: #BBF7D0;
        }

        .btn-remove-item {
            background: #FEE2E2;
            color: #DC2626;
            border: none;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-remove-item:hover {
            background: #FECACA;
        }

        .btn-download {
            background: #F0F9FF;
            color: #0284C7;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-download:hover {
            background: #E0F2FE;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #FEE2E2;
            color: #DC2626;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #FECACA;
            transform: scale(1.05);
        }

        .search-container {
            position: relative;
            width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 0.5rem 0.5rem 0.5rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            pointer-events: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 1rem;
        }

        .pagination-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
            min-width: 40px;
            text-align: center;
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .pagination-info {
            font-size: 0.875rem;
            color: #64748B;
        }

        .action-cell {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-paid {
            background: #DCFCE7;
            color: #16A34A;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-paid:hover {
            background: #BBF7D0;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="title">Invoice History</div>
            <div style="display: flex; gap: 6.5rem; align-items: center;">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by client name...">
                </div>
                <a href="Consolebilling.html" class="btn"><i class="fas fa-arrow-left"></i> Back to Generator</a>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Invoice #</th>
                        <th>Date</th>
                        <th>Client</th>
                        <th>Items</th>
                        <th>Pending</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="invoiceTableBody">
                    <tr>
                        <td colspan="8" class="loading">Loading invoices...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination Controls -->
        <div class="pagination" id="paginationControls" style="display: none;">
            <button class="pagination-btn" id="prevBtn" onclick="changePage(-1)">
                <i class="fas fa-chevron-left"></i>
            </button>
            <span class="pagination-info" id="pageInfo">Page 1 of 1</span>
            <button class="pagination-btn" id="nextBtn" onclick="changePage(1)">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Invoice Details</div>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('invoiceTableBody');

            // 1. Check Library
            if (!window.supabase) {
                tbody.innerHTML = `<tr><td colspan="8" style="color:red; text-align:center; padding:2rem;">
                    <strong>Error:</strong> Supabase library not loaded. Check your internet connection.
                </td></tr>`;
                return;
            }

            // 2. Init Client
            const SUPABASE_URL = 'https://rdubzgyjyyumapvifwuq.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdWJ6Z3lqeXl1bWFwdmlmd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyOTI0OTAsImV4cCI6MjA4MDg2ODQ5MH0.ZNgFLKO0z5xpASKFAr1uXp8PPmNsdpwN58I7dP6ZIeM';

            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" style="color:red; text-align:center;">Failed to initialize Supabase: ${err.message}</td></tr>`;
                return;
            }

            // 3. Load Data
            try {
                const { data, error } = await supabase
                    .from('invoices')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 2rem;">No invoices found in database.</td></tr>`;
                    return;
                }

                // 4. Render
                tbody.innerHTML = '';

                // Pagination variables
                let currentPage = 1;
                const itemsPerPage = 10;
                let filteredData = [...data];

                function renderPage() {
                    tbody.innerHTML = '';

                    const startIndex = (currentPage - 1) * itemsPerPage;
                    const endIndex = startIndex + itemsPerPage;
                    const pageData = filteredData.slice(startIndex, endIndex);

                    if (pageData.length === 0 && filteredData.length > 0) {
                        currentPage = 1;
                        renderPage();
                        return;
                    }

                    if (filteredData.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 2rem;">No invoices found.</td></tr>`;
                        document.getElementById('paginationControls').style.display = 'none';
                        return;
                    }

                    pageData.forEach((inv, idx) => {
                        const actualIndex = startIndex + idx;
                        const row = document.createElement('tr');
                        const date = new Date(inv.date_issued || inv.created_at).toLocaleDateString();
                        const symbol = inv.currency || '₹';

                        let itemsSummary = '-';
                        if (Array.isArray(inv.items) && inv.items.length > 0) {
                            itemsSummary = inv.items.map(i => i.desc).join('<br>');
                        }

                        let pendingDisplay = '-';
                        if (inv.pending_amount > 0) {
                            pendingDisplay = `<span style="color:#DC2626; font-weight:500;">
                                ${symbol}${parseFloat(inv.pending_amount).toFixed(2)}
                                ${inv.pending_note ? `<br><span style="font-size:10px;color:#9CA3AF">${inv.pending_note}</span>` : ''}
                            </span>`;
                        }

                        row.innerHTML = `
                            <td style="font-weight:600">#${inv.invoice_number}</td>
                            <td>${date}</td>
                            <td>
                                <div style="font-weight:500">${inv.customer_name || 'Unknown'}</div>
                                <div style="font-size:11px;color:#64748B">${inv.customer_title || ''}</div>
                            </td>
                            <td style="max-width:300px; color:#475569; font-size:12px;">${itemsSummary}</td>
                            <td>${pendingDisplay}</td>
                            <td style="font-weight:600">${symbol}${parseFloat(inv.total).toFixed(2)}</td>
                            <td><span class="badge badge-blue">Saved</span></td>
                            <td class="action-cell">
                                <button class="btn-view" onclick="openModal('${inv.invoice_number}')" title="View Details"><i class="fas fa-eye"></i></button>
                                <button class="btn-download" onclick="downloadInvoicePDF('${inv.invoice_number}')" title="Download PDF"><i class="fas fa-download"></i></button>
                                <button class="btn-paid" onclick="downloadPaidInvoicePDF('${inv.invoice_number}')" title="Download as PAID"><i class="fas fa-check-circle"></i></button>
                                <button class="btn-delete" onclick="deleteInvoice('${inv.invoice_number}')" title="Delete Invoice"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });

                    // Update pagination controls
                    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
                    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
                    document.getElementById('prevBtn').disabled = currentPage === 1;
                    document.getElementById('nextBtn').disabled = currentPage === totalPages;
                    document.getElementById('paginationControls').style.display = totalPages > 1 ? 'flex' : 'none';
                }

                window.changePage = (direction) => {
                    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
                    currentPage += direction;
                    if (currentPage < 1) currentPage = 1;
                    if (currentPage > totalPages) currentPage = totalPages;
                    renderPage();
                };

                // Initial render
                renderPage();

                // Search functionality
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase().trim();

                    if (searchTerm === '') {
                        filteredData = [...data];
                    } else {
                        filteredData = data.filter(inv => {
                            const clientName = (inv.customer_name || '').toLowerCase();
                            return clientName.includes(searchTerm);
                        });
                    }

                    currentPage = 1;
                    renderPage();
                });

                // Expose openModal to window scope
                let editMode = false;
                let currentInvoice = null;
                let currentIndex = null;

                window.openModal = (invoiceNumber) => {
                    const index = data.findIndex(i => i.invoice_number == invoiceNumber);
                    if (index === -1) return;
                    currentIndex = index;
                    currentInvoice = JSON.parse(JSON.stringify(data[index])); // Deep copy
                    editMode = false;
                    renderModalContent();
                    document.getElementById('detailsModal').classList.add('active');
                };

                window.toggleEdit = () => {
                    editMode = !editMode;
                    renderModalContent();
                };

                // PDF Download Function - Define globally
                window.downloadInvoicePDF = async (invoiceNumber) => {
                    const index = data.findIndex(i => i.invoice_number == invoiceNumber);
                    if (index === -1) return;
                    const inv = data[index];
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    doc.setFont('helvetica');

                    const primaryBlue = [59, 130, 246];
                    const darkText = [31, 41, 55];
                    const grayText = [156, 163, 175];
                    const purple = [139, 92, 246];
                    const pink = [236, 72, 153];
                    const cur = inv.currency === '₹' ? 'INR ' : inv.currency + ' ';

                    // Logo Dots
                    doc.setFillColor(...primaryBlue);
                    doc.circle(16, 15, 1.2, 'F');
                    doc.circle(20, 15, 1.2, 'F');
                    doc.setFillColor(...purple);
                    doc.circle(16, 18.5, 1.2, 'F');
                    doc.circle(20, 18.5, 1.2, 'F');
                    doc.circle(24, 18.5, 1.2, 'F');
                    doc.setFillColor(...pink);
                    doc.circle(16, 22, 1.2, 'F');
                    doc.circle(20, 22, 1.2, 'F');

                    doc.setFontSize(22);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor(...darkText);
                    doc.text('Console Projects', 30, 21);

                    // Invoice # and Date
                    doc.setFontSize(9);
                    doc.setTextColor(...grayText);
                    doc.setFont(undefined, 'normal');
                    doc.text('INVOICE #', 196, 15, { align: 'right' });
                    doc.setFontSize(12);
                    doc.setTextColor(...darkText);
                    doc.setFont(undefined, 'bold');
                    doc.text(inv.invoice_number || '0001', 196, 21, { align: 'right' });

                    doc.setFontSize(9);
                    doc.setTextColor(...grayText);
                    doc.setFont(undefined, 'normal');
                    doc.text('DATE', 196, 28, { align: 'right' });
                    doc.setFontSize(10);
                    doc.setTextColor(...darkText);
                    const date = new Date(inv.date_issued || inv.created_at).toLocaleDateString();
                    doc.text(date, 196, 34, { align: 'right' });

                    // Bill To Section
                    doc.setFillColor(...primaryBlue);
                    doc.roundedRect(14, 45, 120, 35, 3, 3, 'F');
                    doc.setTextColor(255, 255, 255);
                    doc.setFontSize(13);
                    doc.setFont(undefined, 'bold');
                    doc.text((inv.customer_name || 'CLIENT').toUpperCase(), 20, 56);
                    doc.setFontSize(10);
                    doc.setFont(undefined, 'normal');
                    doc.text(inv.customer_title || '', 20, 62);
                    doc.setFontSize(9);
                    const addrLines = doc.splitTextToSize(inv.customer_address || '', 100);
                    doc.text(addrLines, 20, 68);

                    // Total Box
                    doc.setFillColor(255, 255, 255);
                    doc.roundedRect(145, 50, 50, 25, 2, 2, 'F');
                    doc.setTextColor(...grayText);
                    doc.setFontSize(8);
                    doc.text('TOTAL AMOUNT', 170, 58, { align: 'center' });
                    doc.setTextColor(...darkText);
                    doc.setFontSize(15);
                    doc.setFont(undefined, 'bold');
                    doc.text(cur + (inv.total || 0).toFixed(2), 170, 67, { align: 'center' });

                    // Items Table
                    const tableData = (inv.items || []).map(item => [
                        item.desc || 'Item',
                        item.qty.toString(),
                        cur + item.price.toFixed(2),
                        cur + (item.qty * item.price).toFixed(2)
                    ]);

                    doc.autoTable({
                        startY: 95,
                        head: [['DESCRIPTION', 'QTY', 'PRICE', 'TOTAL']],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [248, 250, 252], textColor: [71, 85, 105], fontStyle: 'bold' },
                        styles: { fontSize: 9, font: 'helvetica' },
                        columnStyles: {
                            0: { cellWidth: 90 },
                            1: { halign: 'center' },
                            2: { halign: 'right' },
                            3: { halign: 'right' }
                        }
                    });

                    let finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : 130;

                    // Summary
                    doc.setFontSize(10);
                    doc.setTextColor(...darkText);
                    doc.setFont(undefined, 'normal');
                    doc.text('Subtotal:', 110, finalY);
                    const subTot = inv.subtotal || inv.total || 0;
                    doc.text(cur + subTot.toFixed(2), 196, finalY, { align: 'right' });

                    if (inv.pending_amount > 0) {
                        finalY += 7;
                        doc.setTextColor(220, 38, 38);
                        doc.text(`Pending ${inv.pending_note ? '(' + inv.pending_note + ')' : ''}:`, 110, finalY);

                            </div>
                        `;
                    }
                }

                window.closeModal = () => {
                    document.getElementById('detailsModal').classList.remove('active');
                };

                // Close on outside click
                document.getElementById('detailsModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('detailsModal')) {
                        window.closeModal();
                    }
                });

            } catch (err) {
                console.error("Load Error:", err);
                tbody.innerHTML = `<tr><td colspan="10" style="color:red; text-align:center; padding:2rem;">
                    Error loading data: ${err.message || JSON.stringify(err)}
                </td></tr>`;
            }
        });
    </script>
</body>

</html>
