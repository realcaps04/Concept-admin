<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Settings - FOS Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1A6CFF;
            --bg-light: #F8FAFC;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px;
            display: flex;
            align-items: center;
            background: white;
            border-bottom: 1px solid #F1F5F9;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back-btn:active {
            background: #F1F5F9;
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            text-align: center;
            margin-right: 40px;
        }

        /* Profile Section */
        .profile-hero {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-image-container {
            position: relative;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            object-fit: cover;
        }

        .edit-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 36px;
            height: 36px;
            background: var(--primary-blue);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(26, 108, 255, 0.3);
            cursor: pointer;
        }

        .user-name {
            font-size: 26px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 12px;
        }

        .role-badge {
            background: #EFF6FF;
            color: var(--primary-blue);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Menu Section */
        .menu-container {
            padding: 0 24px;
            flex: 1;
        }

        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .menu-item {
            background: white;
            border: 1px solid #F1F5F9;
            border-radius: 20px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .menu-item:active {
            transform: scale(0.98);
            background: #F8FAFC;
        }

        .menu-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-blue {
            background: #EFF6FF;
            color: var(--primary-blue);
        }

        .bg-green {
            background: #F0FDF4;
            color: #22C55E;
        }

        .bg-red {
            background: #FEF2F2;
            color: #EF4444;
        }

        .menu-info {
            flex: 1;
        }

        .menu-title {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 2px;
        }

        .menu-desc {
            font-size: 13px;
            color: #64748B;
            font-weight: 500;
        }

        .chevron {
            color: #CBD5E1;
        }

        /* Version Info */
        .version-box {
            margin: 20px 24px 40px;
            padding: 20px;
            border: 1px dashed #CBD5E1;
            border-radius: 16px;
            text-align: center;
        }

        .version-text {
            font-size: 11px;
            font-weight: 700;
            color: #64748B;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        /* Animation */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate {
            animation: slideIn 0.4s ease-out forwards;
        }
    </style>
</head>

<body>
    <header>
        <button class="back-btn" onclick="window.history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <h1>Profile & Settings</h1>
    </header>

    <div class="profile-hero">
        <div class="profile-image-container animate" style="animation-delay: 0.1s;">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" id="profileImg" alt="Profile"
                class="profile-avatar">
            <div class="edit-badge">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </div>
        </div>
        <h2 class="user-name animate" id="userName" style="animation-delay: 0.2s;">Alex Thompson</h2>
        <span class="role-badge animate" id="userRole" style="animation-delay: 0.3s;">Team Lead</span>
    </div>

    <div class="menu-container">
        <p class="section-label animate" style="animation-delay: 0.35s;">Account Management</p>

        <div class="menu-list">
            <a href="#" class="menu-item animate" style="animation-delay: 0.4s;">
                <div class="menu-icon bg-blue">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="menu-info">
                    <p class="menu-title">Manage Profile</p>
                    <p class="menu-desc">Personal details & work ID</p>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>

            <a href="#" class="menu-item animate" style="animation-delay: 0.45s;">
                <div class="menu-icon bg-green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path
                            d="M9.663 17h4.674M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.989-2.386l-.548-.547z">
                        </path>
                    </svg>
                </div>
                <div class="menu-info">
                    <p class="menu-title">Suggestions</p>
                    <p class="menu-desc">Share your feedback & ideas</p>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>

            <a href="#" class="menu-item animate" style="animation-delay: 0.5s;">
                <div class="menu-icon bg-red">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M8 9.5V4h8v5.5M18 11h3M3 11h3M12 20v-8M6 13a6 6 0 0 0 12 0v-2H6v2zM15 7l3-3M9 7L6 4">
                        </path>
                    </svg>
                </div>
                <div class="menu-info">
                    <p class="menu-title">Bugs</p>
                    <p class="menu-desc">Report technical issues</p>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        </div>
    </div>

    <div class="version-box animate" style="animation-delay: 0.6s;">
        <p class="version-text">Version 2.4.0 (Build 892)<br>Console Projects Online</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = (function () {
                try {
                    return JSON.parse(localStorage.getItem('fos_user')) || JSON.parse(localStorage.getItem('tl_user'));
                } catch (e) { return null; }
            })();

            const profileImg = document.getElementById('profileImg');

            if (!user || !user.name) {
                window.location.href = 'FOSrole.html'; // Go back to role selection if no session
                return;
            }

            // Set user name
            document.getElementById('userName').textContent = user.name;

            // Set refined role display
            let roleLabel = "User";
            if (user.role === 'fos_member') roleLabel = "FOS Member";
            else if (user.role === 'team_lead') roleLabel = "Team Leader";

            document.getElementById('userRole').textContent = roleLabel;

            // Use profile_image_url if available, otherwise fallback to assets/profile-icon.png
            if (user.profile_image_url) {
                profileImg.src = user.profile_image_url;
            } else {
                profileImg.src = "assets/profile-icon.png";
            }

            // Handle image load error (e.g. broken URL)
            profileImg.onerror = function () {
                this.src = "assets/profile-icon.png";
            };
        });
    </script>
</body>

</html>
