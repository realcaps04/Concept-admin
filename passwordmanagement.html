<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Management</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .password-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }

        .password-display {
            font-family: monospace;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 2px;
            font-size: 13px;
            color: var(--muted);
        }

        /* Custom Table Layout for 4 Columns */
        #passwordTable .table-row {
            grid-template-columns: 1.5fr 1.5fr 1.5fr 0.8fr;
        }
    </style>
</head>

<body class="centered-layout">
    <div class="background-blur bg-one"></div>
    <div class="background-blur bg-two"></div>

    <section class="shell-wide">
        <div class="card">
            <header class="card-header">
                <div class="brand">
                    <div class="logo-wrap" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            style="width: 24px; height: 24px; color: #5ba6ff;">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <div>
                        <h1>Password Manager</h1>
                        <p class="subtitle" style="margin-bottom: 0;">Securely store and manage your credentials</p>
                    </div>
                </div>
                <a href="index.html" class="back-btn">Back to Home</a>
            </header>

            <main class="card-body">
                <!-- Add New Password Form -->
                <div class="panel">
                    <div class="panel-head">
                        <h3>Add New Credential</h3>
                    </div>
                    <form id="addPasswordForm" class="form-grid">
                        <label class="field">
                            Website / Application
                            <div class="input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path
                                        d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                                    </path>
                                </svg>
                                <select id="siteType" required
                                    style="width: 100%; border: none; background: transparent; color: var(--text); font-size: 15px; font-weight: 600; outline: none; appearance: none; padding: 0;">
                                    <option value="" disabled selected>Select Website / Application</option>
                                    <option value="Gmail">Gmail</option>
                                    <option value="E-District">E-District</option>
                                    <option value="Revenue Dept">Revenue Dept</option>
                                    <option value="Civil Supplies">Civil Supplies</option>
                                    <option value="Motor Vehicles">Motor Vehicles</option>
                                    <option value="UIDAI / Aadhaar">UIDAI / Aadhaar</option>
                                    <option value="Voters Portal">Voters Portal</option>
                                    <option value="Banking">Banking</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </label>

                        <label class="field">
                            Login ID / Username
                            <div class="input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input type="text" id="loginId" placeholder="username@example.com" required>
                            </div>
                        </label>

                        <label class="field">
                            Password
                            <div class="input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="password" placeholder="••••••••" required>
                                <button type="button" class="password-toggle" onclick="togglePassword(this)"
                                    type="button">
                                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="1.5">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="1.5" style="display:none;">
                                        <path
                                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                        <line x1="1" y1="1" x2="23" y2="23" />
                                    </svg>
                                </button>
                            </div>
                        </label>

                        <div class="form-actions">
                            <button type="submit" class="cta">
                                <span>Save Credential</span>
                                <span class="glow"></span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Saved Passwords Table -->
                <div class="panel">
                    <div class="panel-head">
                        <h3>Saved Accounts</h3>
                        <div class="input" style="padding: 8px 12px; width: 250px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                style="width: 16px; height: 16px;">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="searchFilter" placeholder="Search accounts..."
                                style="font-size: 13px;">
                        </div>
                    </div>

                    <div id="passwordTable" class="table">
                        <div class="table-head table-row">
                            <span>Website</span>
                            <span>Login ID</span>
                            <span>Password</span>
                            <span style="text-align: right;">Actions</span>
                        </div>
                        <div id="passwordList">
                            <!-- Dynamic Content Here -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://rdubzgyjyyumapvifwuq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdWJ6Z3lqeXl1bWFwdmlmd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyOTI0OTAsImV4cCI6MjA4MDg2ODQ5MH0.ZNgFLKO0z5xpASKFAr1uXp8PPmNsdpwN58I7dP6ZIeM';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Toggle Password Visibility
        function togglePassword(btn) {
            const input = btn.previousElementSibling;
            const eyeOn = btn.querySelector('.eye-on');
            const eyeOff = btn.querySelector('.eye-off');

            if (input.type === 'password') {
                input.type = 'text';
                eyeOn.style.display = 'none';
                eyeOff.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOn.style.display = 'block';
                eyeOff.style.display = 'none';
            }
        }

        // Handle Form Submission
        const form = document.getElementById('addPasswordForm');
        const list = document.getElementById('passwordList');
        const search = document.getElementById('searchFilter');
        const siteSelect = document.getElementById('siteType');

        let passwords = [];

        // Load Passwords from Supabase
        async function loadPasswords() {
            try {
                const { data, error } = await supabase
                    .from('passwords')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                passwords = data || [];
                renderPasswords(passwords);
            } catch (err) {
                console.error('Error fetching passwords:', err);
                list.innerHTML = `<div class="empty-state"><p class="error">Error loading passwords.</p></div>`;
            }
        }

        // Initial Load
        loadPasswords();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = form.querySelector('.cta');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span>Saving...</span>';
            submitBtn.disabled = true;

            const newEntry = {
                site_type: siteSelect.value,
                login_id: document.getElementById('loginId').value,
                password: document.getElementById('password').value
            };

            try {
                const { data, error } = await supabase
                    .from('passwords')
                    .insert([newEntry])
                    .select(); // Return the inserted data

                if (error) throw error;

                // Optimistically update or reload
                await loadPasswords();
                form.reset();
            } catch (err) {
                console.error('Error adding password:', err);
                alert('Failed to save password. Please try again.');
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        // Search Filter
        search.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = passwords.filter(p =>
                p.site_type.toLowerCase().includes(term) ||
                p.login_id.toLowerCase().includes(term)
            );
            renderPasswords(filtered);
        });

        function renderPasswords(data) {
            if (!data || data.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <p>No passwords saved yet.</p>
                    </div>`;
                return;
            }

            list.innerHTML = data.map(item => `
                <div class="table-row">
                    <div style="font-weight: 600; display:flex; align-items:center;">${item.site_type}</div>
                    <div class="muted" style="display:flex; align-items:center;">${item.login_id}</div>
                    <div class="password-row">
                        <span class="password-display">••••••••</span>
                        <button class="action-btn view-btn" onclick="copyToClipboard('${item.password}')" title="Copy Password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <div style="text-align: right;">
                        <button class="action-btn delete-btn" onclick="deletePassword(${item.id})" title="Delete">
                           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.deletePassword = async (id) => {
            if (confirm('Are you sure you want to delete this credential?')) {
                try {
                    const { error } = await supabase
                        .from('passwords')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    // Remove locally or reload
                    // loadPasswords(); // Reload to be safe
                    // Or filter locally for speed if delete was successful
                    passwords = passwords.filter(p => p.id !== id);
                    renderPasswords(passwords);

                } catch (err) {
                    console.error('Error deleting password:', err);
                    alert('Failed to delete. Please try again.');
                }
            }
        };

        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).then(() => {
                alert('Password copied!');
            });
        };
    </script>
</body>

</html>
