<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members - TL Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #FDFDFD;
            --card-bg: #FFFFFF;
            --text-dark: #111827;
            --text-gray: #6B7280;
            --blue-primary: #2563EB;
            --blue-light: #EFF6FF;
            --green-success: #10B981;
            --green-light: #ECFDF5;
            --border-color: #F3F4F6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-dark);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        /* Header Styles */
        .header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--primary-bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .add-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #F3F4F6;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        /* Search Section */
        .search-section {
            padding: 0 20px;
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            width: 20px;
            height: 20px;
        }

        .search-input {
            width: 100%;
            height: 52px;
            background: #F3F4F6;
            border: none;
            border-radius: 16px;
            padding: 0 14px 0 44px;
            font-size: 15px;
            font-weight: 500;
            outline: none;
        }

        .filter-btn {
            width: 52px;
            height: 52px;
            background: var(--blue-primary);
            border-radius: 16px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        /* Summary Row */
        .summary-row {
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .total-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }


        /* Member List */
        .member-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .member-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .member-card:active {
            transform: scale(0.98);
            background: #F9FAFB;
        }

        .avatar-box {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, #FFD29D 0%, #FF9E5E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        /* Colored gradients for variety */
        .member-card:nth-child(2n) .avatar-box {
            background: linear-gradient(135deg, #FFB0B0 0%, #FF7676 100%);
        }

        .member-card:nth-child(3n) .avatar-box {
            background: linear-gradient(135deg, #A8E6CF 0%, #56C596 100%);
        }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--green-success);
            border: 2px solid white;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .member-id {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
        }

        .card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .on-field {
            background: var(--green-light);
            color: var(--green-success);
        }

        .active-badge {
            background: #F3F4F6;
            color: var(--text-gray);
        }

        .chevron {
            color: #D1D5DB;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #94A3B8;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--blue-primary);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
        }

        /* Shimmer effect for loading */
        .shimmer {
            background: #f6f7f8;
            background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            display: inline-block;
            position: relative;
            animation-duration: 1s;
            animation-fill-mode: forwards;
            animation-iteration-count: infinite;
            animation-name: placeholderShimmer;
            animation-timing-function: linear;
        }

        @keyframes placeholderShimmer {
            0% {
                background-position: -468px 0;
            }

            100% {
                background-position: 468px 0;
            }
        }

        .loading-card {
            height: 92px;
            width: 100%;
            border-radius: 20px;
            background: #F9FAFB;
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Team Members</h1>
        <button class="add-btn" onclick="location.href='FOSMemberRegister.html'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </header>

    <div class="search-section">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="memberSearch" placeholder="Search members by name or ID...">
        </div>
        <button class="filter-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
        </button>
    </div>

    <div class="summary-row">
        <div class="total-label">All Members (<span id="totalCount">0</span>)</div>
    </div>

    <div class="member-list" id="memberList">
        <!-- Skeleton Loading -->
        <div class="loading-card shimmer"></div>
        <div class="loading-card shimmer"></div>
        <div class="loading-card shimmer"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="Tldashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
            </svg>
            <span>Dashboard</span>
        </a>
        <a href="TeamMembers.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Team</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" />
            </svg>
            <span>Insights</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function () {
            let user = JSON.parse(localStorage.getItem('tl_user'));
            if (!user) { window.location.href = 'FOSTeamLeadLogin.html'; return; }

            const SUPABASE_URL = 'https://rdubzgyjyyumapvifwuq.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdWJ6Z3lqeXl1bWFwdmlmd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyOTI0OTAsImV4cCI6MjA4MDg2ODQ5MH0.ZNgFLKO0z5xpASKFAr1uXp8PPmNsdpwN58I7dP6ZIeM';

            let supabase;
            let allMembers = [];

            function init() {
                if (!window.supabase) { setTimeout(init, 100); return; }
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                fetchMembers();
            }

            async function fetchMembers() {
                const empId = user.employee_id || user.id;
                try {
                    const { data, error } = await supabase
                        .from('fos_members')
                        .select('*')
                        .eq('team_leader_id', empId)
                        .order('name');

                    if (error) throw error;
                    allMembers = data || [];
                    renderMembers(allMembers);
                    updateCounters(allMembers);
                } catch (err) {
                    console.error('Error:', err);
                    document.getElementById('memberList').innerHTML = '<p style="text-align:center; padding: 20px;">Failed to load members.</p>';
                }
            }

            function updateCounters(members) {
                document.getElementById('totalCount').textContent = members.length;
            }

            function renderMembers(members) {
                const list = document.getElementById('memberList');
                list.innerHTML = '';

                if (members.length === 0) {
                    list.innerHTML = '<p style="text-align:center; padding: 20px; color: var(--text-gray);">No members found.</p>';
                    return;
                }

                members.forEach(m => {
                    const initials = m.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                    const statusClass = m.status === 'active' ? 'on-field' : 'active-badge';
                    const statusText = (m.status || 'ACTIVE').toUpperCase();

                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.onclick = () => window.location.href = `MemberActivityDetail.html?id=${m.employee_id}`;
                    card.innerHTML = `
                        <div class="avatar-box">
                            ${initials}
                            <div class="status-dot"></div>
                        </div>
                        <div class="member-info">
                            <div class="member-name">${m.name}</div>
                            <div class="member-id">ID: ${m.employee_id || 'N/A'}</div>
                        </div>
                        <div class="card-right">
                            <div class="status-badge ${statusClass}">${statusText}</div>
                            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </div>
                    `;
                    list.appendChild(card);
                });
            }

            // Search Filter
            document.getElementById('memberSearch').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allMembers.filter(m =>
                    m.name.toLowerCase().includes(term) ||
                    (m.employee_id && m.employee_id.toLowerCase().includes(term))
                );
                renderMembers(filtered);
            });

            init();
        })();
    </script>
</body>

</html>
