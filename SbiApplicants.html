<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBI Applicants - Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .applicants-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .applicants-title-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            justify-content: flex-end;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-4px);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        .create-applicant-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .create-applicant-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .create-applicant-btn svg {
            width: 16px;
            height: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .stat-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-label svg {
            width: 18px;
            height: 18px;
            color: #667eea;
        }

        .stat-value {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .applicants-table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            overflow-x: auto;
        }

        .search-bar {
            position: relative;
            min-width: 300px;
            max-width: 400px;
        }

        .search-bar input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar svg {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--muted);
        }

        .applicants-table {
            width: 100%;
            border-collapse: collapse;
        }

        .applicants-table thead {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .applicants-table th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .applicants-table td {
            padding: 1rem;
            color: var(--text);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .applicants-table tbody tr {
            transition: all 0.2s ease;
        }

        .applicants-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .status-approved {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .empty-state p {
            font-size: 15px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 24px;
            color: var(--text);
        }

        .close-modal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .close-modal svg {
            width: 20px;
            height: 20px;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
    </style>
</head>

<body>
    <div class="background-blur bg-one"></div>
    <div class="background-blur bg-two"></div>

    <section class="shell shell-wide">
        <div class="card">
            <header class="card-header">
                <div class="brand">
                    <div class="logo-wrap" aria-hidden="true">
                        <img src="assets/logo.svg" alt="Admin portal logo" />
                    </div>
                    <div>
                        <p class="eyebrow">Admin Portal</p>
                        <h1 class="page-title">SBI Applicants</h1>
                    </div>
                </div>
            </header>

            <main class="card-body">
                <!-- Header with Back Button and Create Button -->
                <div class="applicants-header">
                    <div class="applicants-title-section">
                        <button class="back-btn" onclick="window.location.href='admin-dashboard.html'"
                            title="Back to Dashboard">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 12H5M12 19l-7-7 7-7" />
                            </svg>
                        </button>
                    </div>
                    <div class="header-actions">
                        <div class="search-bar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <input type="text" id="searchInput" placeholder="Search applicants..." />
                        </div>
                        <button class="create-applicant-btn" id="createApplicantBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                            Create New Applicant
                        </button>
                    </div>
                </div>

                <!-- Statistics Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            Total Applicants
                        </div>
                        <div class="stat-value" id="totalApplicants">0</div>
                    </div>
                </div>

                <!-- Applicants Table -->
                <div class="applicants-table-container">

                    <div id="tableContent">
                        <!-- Empty State -->
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <h3>No Applicants Yet</h3>
                            <p>Click "Create New Applicant" to add your first applicant</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <!-- Create Applicant Modal -->
    <div class="modal-overlay" id="applicantModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Applicant</h2>
                <button class="close-modal" id="closeModal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <form id="applicantForm">
                <div class="form-group">
                    <label>Applicant Name <span style="color: #ef4444;">*</span></label>
                    <input type="text" id="applicantName" required placeholder="Enter full name" />
                </div>

                <div class="form-group">
                    <label>Email Address <span style="color: #ef4444;">*</span></label>
                    <input type="email" id="applicantEmail" required placeholder="applicant@example.com" />
                </div>

                <div class="form-group">
                    <label>Password <span style="color: #ef4444;">*</span></label>
                    <input type="password" id="applicantPassword" required placeholder="Set login password" />
                </div>

                <div class="form-group">
                    <label>Loan Type <span style="color: #ef4444;">*</span></label>
                    <select id="loanType" required>
                        <option value="">Select loan type</option>
                        <option value="home_loan">Home Loan</option>
                        <option value="personal_loan">Personal Loan</option>
                        <option value="car_loan">Car Loan</option>
                        <option value="education_loan">Education Loan</option>
                        <option value="business_loan">Business Loan</option>
                        <option value="gold_loan">Gold Loan</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Create Applicant</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://rdubzgyjyyumapvifwuq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdWJ6Z3lqeXl1bWFwdmlmd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyOTI0OTAsImV4cCI6MjA4MDg2ODQ5MH0.ZNgFLKO0z5xpASKFAr1uXp8PPmNsdpwN58I7dP6ZIeM';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Modal functionality
        const modal = document.getElementById('applicantModal');
        const createBtn = document.getElementById('createApplicantBtn');
        const closeBtn = document.getElementById('closeModal');
        const form = document.getElementById('applicantForm');

        createBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Form submission - Save to Supabase
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const applicantData = {
                applicant_name: document.getElementById('applicantName').value,
                email: document.getElementById('applicantEmail').value,
                password: document.getElementById('applicantPassword').value,
                loan_type: document.getElementById('loanType').value,
                status: 'pending',
                created_at: new Date().toISOString()
            };

            try {
                const { data, error } = await sbClient
                    .from('sbi_applicants')
                    .insert([applicantData])
                    .select();

                if (error) throw error;

                alert('Applicant created successfully!');
                modal.classList.remove('active');
                form.reset();

                // Reload applicants list
                await loadApplicants();
            } catch (error) {
                console.error('Error creating applicant:', error);
                alert('Error creating applicant: ' + error.message);
            }
        });

        // Load and display applicants
        async function loadApplicants() {
            try {
                const { data, error } = await sbClient
                    .from('sbi_applicants')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                displayApplicants(data || []);
                updateStats(data || []);
            } catch (error) {
                console.error('Error loading applicants:', error);
                document.getElementById('tableContent').innerHTML = `
                    <div class="empty-state">
                        <p style="color: #ef4444;">Error loading applicants: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Display applicants in table
        function displayApplicants(applicants) {
            const tableContent = document.getElementById('tableContent');

            if (applicants.length === 0) {
                tableContent.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <h3>No Applicants Yet</h3>
                        <p>Click "Create New Applicant" to add your first applicant</p>
                    </div>
                `;
                return;
            }

            tableContent.innerHTML = `
                <table class="applicants-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">Applicant Name</th>
                            <th style="width: 25%;">Email</th>
                            <th style="width: 20%;">Loan Type</th>
                            <th style="width: 15%;">Created Date</th>
                            <th style="width: 15%; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${applicants.map(applicant => `
                            <tr>
                                <td style="font-weight: 600;">${applicant.applicant_name}</td>
                                <td style="color: var(--muted);">${applicant.email}</td>
                                <td>${formatLoanType(applicant.loan_type)}</td>
                                <td>${formatDate(applicant.created_at)}</td>
                                <td>
                                    <div class="action-buttons" style="justify-content: center;">
                                        <button class="action-btn" onclick="viewApplicant(${applicant.id})" title="View Details">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                                <circle cx="12" cy="12" r="3"></circle>
                                            </svg>
                                        </button>
                                        <button class="action-btn" onclick="editApplicant(${applicant.id})" title="Edit">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                            </svg>
                                        </button>
                                        <button class="action-btn" onclick="deleteApplicant(${applicant.id})" title="Delete">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // View applicant details
        async function viewApplicant(id) {
            try {
                const { data, error } = await sbClient
                    .from('sbi_applicants')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                // Navigate to individual applicant page
                window.location.href = `applicant-details.html?id=${id}`;
            } catch (error) {
                console.error('Error viewing applicant:', error);
                alert('Error loading applicant details');
            }
        }

        // Edit applicant
        async function editApplicant(id) {
            try {
                const { data, error } = await sbClient
                    .from('sbi_applicants')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                // Populate form with existing data
                document.getElementById('applicantName').value = data.applicant_name;
                document.getElementById('applicantEmail').value = data.email;
                document.getElementById('applicantPassword').value = data.password;
                document.getElementById('loanType').value = data.loan_type;

                // Store the ID for update
                form.dataset.editId = id;

                // Change button text
                const submitBtn = form.querySelector('.submit-btn');
                submitBtn.textContent = 'Update Applicant';

                // Open modal
                modal.classList.add('active');

                // Update form submission to handle edit
                form.onsubmit = async (e) => {
                    e.preventDefault();

                    const updatedData = {
                        applicant_name: document.getElementById('applicantName').value,
                        email: document.getElementById('applicantEmail').value,
                        password: document.getElementById('applicantPassword').value,
                        loan_type: document.getElementById('loanType').value
                    };

                    try {
                        const { error } = await sbClient
                            .from('sbi_applicants')
                            .update(updatedData)
                            .eq('id', id);

                        if (error) throw error;

                        alert('Applicant updated successfully!');
                        modal.classList.remove('active');
                        form.reset();
                        delete form.dataset.editId;
                        submitBtn.textContent = 'Create Applicant';

                        // Reset form submission
                        form.onsubmit = null;

                        await loadApplicants();
                    } catch (error) {
                        console.error('Error updating applicant:', error);
                        alert('Error updating applicant: ' + error.message);
                    }
                };
            } catch (error) {
                console.error('Error loading applicant:', error);
                alert('Error loading applicant data');
            }
        }

        // Delete applicant
        async function deleteApplicant(id) {
            if (!confirm('Are you sure you want to delete this applicant?')) return;

            try {
                const { error } = await sbClient
                    .from('sbi_applicants')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert('Applicant deleted successfully!');
                await loadApplicants();
            } catch (error) {
                console.error('Error deleting applicant:', error);
                alert('Error deleting applicant: ' + error.message);
            }
        }

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let allApplicants = [];

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();

            if (searchTerm === '') {
                displayApplicants(allApplicants);
            } else {
                const filtered = allApplicants.filter(applicant =>
                    applicant.applicant_name.toLowerCase().includes(searchTerm) ||
                    applicant.loan_type.toLowerCase().includes(searchTerm)
                );
                displayApplicants(filtered);
            }
        });

        // Update statistics
        function updateStats(applicants) {
            document.getElementById('totalApplicants').textContent = applicants.length;
            allApplicants = applicants;
        }

        // Helper functions
        function formatLoanType(type) {
            return type.split('_').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Initialize - Load applicants on page load
        loadApplicants();
    </script>
</body>

</html>
